  industry:
    model: Osby Parca EL 500 Eco, 504 kW
    name: electricity, used in industrial electric boiler
    power_kW: 504
    mass_kg: 410
    lifetime_years: 20
    lifetime_range: [20, 30]
    material_fractions: {low_alloy: 0.581, brass: 0.011, electronics: 0.242, rubber: 0.026, unmodelled: 0.14}
    source_ids: [osby, ctc_bvd]
    limitations:
      - Published industrial hot-water-boiler mass and power; material fractions and 20-year life are transferred from CTC EL 42 as explicit engineering proxies.
      - Industrial steam/electrode-boiler composition and Swiss technology shares remain unresolved; this is a provisional resistance-boiler archetype.
      - Steel-plate group uses low-alloy steel; stainless-steel substitution must be reported as a sensitivity.
      - Cable/electronics use a generic control-unit electronics proxy; unidentified 14% remains unmodelled. No elemental metal fractions are invented.
      - Installation, circulation pump, manufacturing assembly energy and end-of-life remain unquantified.
    pathway: FE_industry_process_electric_boiler
