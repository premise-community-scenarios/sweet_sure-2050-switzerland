materials:
  stainless: market for steel, chromium steel 18/8
  low_alloy: market for steel, low-alloyed
  brass: market for brass
  electronics: market for electronics, for control units
  rubber: market for synthetic rubber
  plastic: market for polypropylene, granulate
  insulation: market for polyurethane, rigid foam
  bitumen: market for bitumen seal
  paper: market for paper, woodfree, uncoated
profiles:
  residential_space:
    model: CTC EL 9
    name: electricity, used in residential electric boiler
    power_kW: 9
    mass_kg: 9.3
    lifetime_years: 20
    lifetime_range: [20, 25]
    material_fractions: {stainless: 0.577, brass: 0.041, electronics: 0.207, rubber: 0.089, unmodelled: 0.086}
    source_ids: [ctc_bvd, ctc_manual]
    limitations:
      - EU resistance-flow heater proxy; Swiss installed technology mix is unknown.
      - Steel group represented by 18/8 stainless; actual steel grades and their split are not disclosed.
      - Cable/electronics mass uses generic control-unit electronics; unidentified 8.6% remains unmodelled. The control-unit composition is an LCI proxy, not a measured split.
      - Installation, circulation pump and manufacturing assembly energy are not quantified by the declaration.
    pathway: FE_residential_space_heating_electric_boiler
    capacity_variable: Space and water heat boiler capacity in Residential sector|Space heating|Electricty|Electric boiler
    energy_variable: Fuel consumption in Residential sector|Electricity|Space heating|Electric boiler
  residential_water:
    model: Høiax Connected 200, 190 L
    name: electricity, used in residential electric water heater
    power_kW: 2
    mass_kg: 31.01
    lifetime_years: 17
    lifetime_range: [17, 25]
    materials_kg: {stainless: 20.43, brass: 0.68, plastic: 4.69, insulation: 4.55, electronics: 0.52, bitumen: 0.01, paper: 0.13}
    source_ids: [hoiax]
    limitations:
      - Norwegian storage-water-heater proxy; declared rounded material masses sum to 31.01 kg versus 31 kg nominal.
      - Steel aggregate represented by 18/8 stainless; stainless/mild-steel split and resistance-alloy composition are unresolved.
      - Plastics, insulation and electronics use generic PP, PU foam and control-unit electronics LCI proxies.
      - Packaging, manufacturing assembly energy and end-of-life are not reconstructed from EPD impact scores.
    pathway: FE_residential_water_heating_electric_boiler
    capacity_variable: Space and water heat boiler capacity in Residential sector|Water heating|Electricty|Electric boiler
    energy_variable: Fuel consumption in Residential sector|Electricity|Water heating|Electric boiler
  services:
    model: CTC EL 42
    name: electricity, used in services electric boiler
    power_kW: 42
    mass_kg: 33
    lifetime_years: 20
    lifetime_range: [20, 25]
    material_fractions: {stainless: 0.581, brass: 0.011, electronics: 0.242, rubber: 0.026, unmodelled: 0.14}
    source_ids: [ctc_bvd, ctc_manual]
    limitations:
      - EU resistance-flow heater proxy; Swiss installed technology mix is unknown.
      - Steel group represented by 18/8 stainless; actual steel grades and their split are not disclosed.
      - Cable/electronics mass uses generic control-unit electronics; unidentified 14% remains unmodelled.
      - Installation, circulation pump and manufacturing assembly energy are not quantified by the declaration.
