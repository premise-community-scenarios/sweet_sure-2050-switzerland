name: refined-metal-inputs
version: 2
scope: Selected refined elemental metals, commodity compounds, and separate alloy product masses.
boundary: Count selected products delivered to activities whose reference product is outside the same indicator's selected product set. Internal distribution and conversion receive zero factors.
interpretation: Model-attributed gross deliveries at the selected product boundary; signed activity credits are retained. These indicators are not physical stock balances, primary extraction, or quantities retained in final equipment. Metal and alloy indicators can overlap and must not be added together.
composition_policy: Nominal elemental purity for elemental products; documented contents or chemical stoichiometry for selected compounds. No inferred composition for generic alloys. Products not listed are outside this explicit boundary and are reported in the coverage inventory.
atomic_weights_source: https://ciaaw.org/abridged-atomic-weights.htm
atomic_weights_version: Abridged standard atomic weights 2024, nominal values
atomic_weights: {H: 1.0080, Li: 6.94, Be: 9.0122, B: 10.81, C: 12.011, N: 14.007, O: 15.999, F: 18.998, Na: 22.990, Mg: 24.305, Al: 26.982, Si: 28.085, P: 30.974, S: 32.06, Cl: 35.45, K: 39.098, Ca: 40.078, Sc: 44.956, Ti: 47.867, V: 50.942, Cr: 51.996, Mn: 54.938, Fe: 55.845, Co: 58.933, Ni: 58.693, Cu: 63.546, Zn: 65.38, Ga: 69.723, As: 74.922, Se: 78.971, Sr: 87.62, Y: 88.906, Zr: 91.222, Nb: 92.906, Mo: 95.95, Ru: 101.07, Rh: 102.91, Pd: 106.42, Ag: 107.87, Cd: 112.41, In: 114.82, Sn: 118.71, Sb: 121.76, Te: 127.60, Ba: 137.33, La: 138.91, Ce: 140.12, Pr: 140.91, Nd: 144.24, Sm: 150.36, Eu: 151.96, Gd: 157.25, Tb: 158.93, Dy: 162.50, Ho: 164.93, Er: 167.26, Tm: 168.93, Yb: 173.05, Lu: 174.97, Hf: 178.49, Ta: 180.95, W: 183.84, Re: 186.21, Ir: 192.22, Pt: 195.08, Au: 196.97, Hg: 200.59, Pb: 207.2, U: 238.03}
sources:
  - {id: ecoinvent-products, url: 'https://support.ecoinvent.org/activities-products', note: Product identity and supplier/consumer semantics; local 3.12 product_information records supply chemical identities and stated compositions.}
  - {id: ecoinvent-system-model, url: 'https://support.ecoinvent.org/system-models', note: Allocated cutoff inventory interpretation; intermediate flows are not an unallocated physical material balance.}
  - {id: premise-lithium, path: 'premise/data/additional_inventories/lci-lithium.xlsx', doi: '10.1016/j.resconrec.2021.105762', note: Battery-grade lithium hydroxide represents LiOH.H2O; ordinary lithium hydroxide represents anhydrous LiOH.}
  - {id: premise-cobalt, path: 'premise/data/additional_inventories/lci-cobalt.xlsx', note: Cobalt sulfate inventory explicitly uses 0.38 kg Co per kg CoSO4.}
  - {id: lithium-primary-study, url: 'https://www.osti.gov/servlets/purl/1868964', note: Kelly et al. 2021 distinguishes carbonate and hydroxide monohydrate.}
  - {id: chromium-cas, url: 'https://pubchem.ncbi.nlm.nih.gov/compound/Chromium-trioxide', note: CAS 1333-82-0 confirms CrO3; the local product paragraph incorrectly describes Cr2O3.}
  - {id: manganese-cas, url: 'https://pubchem.ncbi.nlm.nih.gov/compound/Manganese-sulphate', note: CAS 7785-87-7 confirms MnSO4.}
  - {id: silane-cas, url: 'https://webbook.nist.gov/cgi/cbook.cgi?ID=7803-62-5', note: CAS 7803-62-5 confirms SiH4; the local product paragraph abbreviates it incorrectly as Si.}
  - {id: lutetium-oxide, url: "https://pubchem.ncbi.nlm.nih.gov/compound/159406", note: Lu2O3 identity for the refined oxide product.}
  - {id: praseodymium-oxide, url: 'https://pubchem.ncbi.nlm.nih.gov/compound/159413', note: Nominal Pr6O11 convention for unspecified commercial praseodymium oxide.}
