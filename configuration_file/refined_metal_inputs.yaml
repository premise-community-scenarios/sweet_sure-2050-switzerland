unavailable_elements:
  Bismuth: No identified refined product in the scenario package indices.
  Germanium: Only concentrate identified; its variable content and upstream stage do not support a refined-metal indicator.
  Osmium: No identified separate refined product in the scenario package indices.
  Rubidium: No identified separate refined product in the scenario package indices.
  Thallium: No identified separate refined product in the scenario package indices.
  Thorium: No identified separate refined product in the scenario package indices.
  Uranium: Yellowcake and fuel/enrichment products mix contained-U and compound/product conventions; not assigned an unverified mass factor. RELICS uranium extraction remains available.
  Promethium: No identified separate refined product in the scenario package indices.

coverage_limits:
  - Selected compounds are an explicit subset, not all chemicals containing each element. See each product list and the unselected-product inventory.
  - Mixed rare-earth oxides (La-Ce, Pr-Nd, Sm-Eu-Gd and Tb-Dy) lack verified elemental splits. Their direct use is outside the quantified subset; selected separated oxides downstream are counted.
  - Generic alloys are measured separately in product mass; embedded elemental metal is not inferred.
  - Components, ores, concentrates, scraps and wastes are outside the selected commodity boundary.
  - Absence from the selected products is a coverage limitation, not proof of zero material use.
